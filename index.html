<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUSH DAY AMAN</title>
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        body { margin: 0; background: #0a0a0a; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background-image: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80'); background-size: cover; background-position: center; }
        .glass-card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; padding: 25px; width: 85%; max-width: 400px; margin-top: 50px; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .dots { display: flex; gap: 10px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; background: #333; }
        .dot.done { background: #00d4ff; box-shadow: 0 0 10px #00d4ff; }
        .controls { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 15px; margin: 15px 0; border: 1px solid rgba(255,255,255,0.05); }
        button { background: #00d4ff; border: none; padding: 12px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; color: #000; }
        #victory { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; font-size: 3rem; color: #ffd700; font-weight: bold; text-transform: uppercase; z-index: 100; }
    </style>
</head>
<body>

    <div id="victory">LEGENDARY!</div>

    <div class="glass-card">
        <div class="header-row">
            <h2 id="day-title">PUSH DAY</h2>
            <div class="dots" id="indicator">
                <div class="dot" id="d0"></div>
                <div class="dot" id="d1"></div>
                <div class="dot" id="d2"></div>
            </div>
        </div>
        <div id="content"></div>
        <button id="finish-btn" style="width:100%; margin-top:20px;" onclick="finishTraining()">ЗАВЕРШИТЬ ДЕНЬ</button>
    </div>

    <script>
        const schedule = [
            { title: "PUSH DAY", ex: ["Жим штанги", "Жим гантелей", "Брусья"] },
            { title: "PULL DAY", ex: ["Подтягивания", "Тяга штанги", "Сгибания"] },
            { title: "LEGS DAY", ex: ["Приседания", "Жим ногами", "Подъем ног"] }
        ];

        let activeDay = parseInt(localStorage.getItem('activeDay')) || 0;

        function render() {
            document.getElementById('day-title').innerText = schedule[activeDay].title;
            for(let i=0; i<3; i++) document.getElementById('d'+i).className = 'dot ' + (i < activeDay ? 'done' : '');
            
            document.getElementById('content').innerHTML = schedule[activeDay].ex.map(ex => `
                <div class="controls">
                    <span>${ex}</span>
                    <span>50 kg</span>
                </div>
            `).join('');
        }

        function finishTraining() {
            document.getElementById('victory').style.display = 'flex';
            localStorage.setItem('lastFinished', new Date().getTime());
            setTimeout(() => {
                document.getElementById('victory').style.display = 'none';
                activeDay = (activeDay + 1) % 3;
                localStorage.setItem('activeDay', activeDay);
                location.reload();
            }, 2000);
        }

        render();
    </script>
</body>
</html>
