    <!-- LOCKED SCREEN -->
    <div class="locked" id="locked">

        <p id="locked-reason"></p>

    <script>
        // ===================== STATE =====================
        const STORAGE_KEY = 'pushDayAman_v1';
        
        // Default exercises with individual weights
        const DEFAULT_EXERCISES = [
            { name: "Жим штанги лежа", weight: 50 },
            { name: "Жим гантелей сидя", weight: 20 },
            { name: "Брусья", weight: 0 }
        ];
        
        // Load or init state
        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                return JSON.parse(saved);
            }
            return {
                exercises: DEFAULT_EXERCISES.map(e => ({...e, setsDone: 0})),
                currentEx: 0,
                dayNumber: 1,
                lastWorkoutEnd: null,
                isFinished: false
            };
        }
        
        let state = loadState();
        
        // Runtime state (not saved)
        let timerId = null;
        let timeLeft = 0;
        let isTimerRunning = false;
        let canUndo = false;
        let undoTimeoutId = null;
        let lastAction = null; // 'set' or 'exercise'
        
        // ===================== SAVE =====================
        function saveState() {
            const toSave = {
                exercises: state.exercises.map(e => ({...e})),
                currentEx: state.currentEx,
                dayNumber: state.dayNumber,
                lastWorkoutEnd: state.lastWorkoutEnd,
                isFinished: state.isFinished
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
        }
        
        // ===================== LOCK CHECK =====================
        function isWorkoutLocked() {
            if (!state.lastWorkoutEnd) return false;
            const lastEnd = new Date(state.lastWorkoutEnd);
            const now = new Date();
            const sixAM = new Date(now);
            sixAM.setHours(6, 0, 0, 0);
            
            // If last workout was today before 6 AM or yesterday, check if now is after 6 AM next day
            const nextDay6AM = new Date(lastEnd);
            nextDay6AM.setDate(nextDay6AM.getDate() + 1);
            nextDay6AM.setHours(6, 0, 0, 0);
            
            return now < nextDay6AM;
        }
        
        function getUnlockTime() {
            if (!state.lastWorkoutEnd) return null;
            const lastEnd = new Date(state.lastWorkoutEnd);
            const unlock = new Date(lastEnd);
            unlock.setDate(unlock.getDate() + 1);
            unlock.setHours(6, 0, 0, 0);
            return unlock;
        }
        
        // ===================== RENDER =====================
        function render() {
            const stack = document.getElementById('stack');
            const dayInfo = document.getElementById('day-info');
            
            // Show day info
            dayInfo.textContent = `День ${state.dayNumber} | ${state.exercises.filter(e => e.setsDone === 4).length}/${state.exercises.length} упражнений`;
            
            // Check if all done
            if (state.currentEx >= state.exercises.length) {
                showLegendary();
                return;
            }
            
            const current = state.exercises[state.currentEx];
            const sets = current.setsDone;
            const btnText = isTimerRunning 
                ? `ОТДЫХ: ${formatTime(timeLeft)}`
                : (sets === 3 ? "ЗАВЕРШИТЬ УПРАЖНЕНИЕ" : "ЗАВЕРШИТЬ ПОДХОД");
            
            stack.innerHTML = state.exercises.map((ex, i) => {
                let cardClass = '';
                if (i < state.currentEx) cardClass = 'done';
                else if (i === state.currentEx) cardClass = 'active';
                else cardClass = 'future';
                
                const isCurrent = i === state.currentEx;
                const showUndo = isCurrent && canUndo && !isTimerRunning;
                
                return `
                    <div class="card ${cardClass}" style="z-index: ${10 - i}; top: ${i * 8}px;">
                        <h3>${ex.name}</h3>
                        ${isCurrent ? `
                            <div class="controls">
                                <button onclick="changeW(-2.5)">- 2.5</button>
                                <span>${ex.weight.toFixed(1)} kg</span>
                                <button onclick="changeW(2.5)">+ 2.5</button>
                            </div>
                            <p class="info">Подход: ${sets + 1}/4 | Повторы: 10-12</p>
                            <button id="main-btn" onclick="nextAction()" ${isTimerRunning ? 'disabled' : ''}>
                                ${btnText}
                            </button>
                            ${showUndo ? `<button class="undo-btn" onclick="undoAction()">ОТМЕНИТЬ ПОДХОД</button>` : ''}
                        ` : `
                            <p class="info">Подходы: ${ex.setsDone}/4</p>
                            <p class="info">Вес: ${ex.weight.toFixed(1)} kg</p>
                        `}
                    </div>
                `;
            }).join('');
        }
        
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s < 10 ? '0'+s : s}`;
        }
        
        // ===================== ACTIONS =====================
        function changeW(delta) {
            if (isTimerRunning) return;
            const ex = state.exercises[state.currentEx];
            ex.weight = Math.max(0, ex.weight + delta);
            saveState();
            render();
        }
        
        function nextAction() {
            if (isTimerRunning) return;
            
            const ex = state.exercises[state.currentEx];
            const wasSets = ex.setsDone;
            
            ex.setsDone++;
            lastAction = (ex.setsDone === 4) ? 'exercise' : 'set';
            
            // Enable undo for 5 seconds
            canUndo = true;
            if (undoTimeoutId) clearTimeout(undoTimeoutId);
            undoTimeoutId = setTimeout(() => {
                canUndo = false;
                render();
            }, 5000);
            
            // Determine timer duration
            let duration = 60; // default between sets
            if (ex.setsDone === 4) {
                duration = 180; // 3 min after exercise
            }
            
            // If exercise completed, advance
            if (ex.setsDone === 4) {
                state.currentEx++;
            }
            
            saveState();
            
            // Start timer
            startTimer(duration);
        }
        
        function startTimer(duration) {
            isTimerRunning = true;
            timeLeft = duration;
            render();
            
            timerId = setInterval(() => {
                timeLeft--;
                
                // Update button text without full re-render
                const btn = document.getElementById('main-btn');
                if (btn) btn.innerText = `ОТДЫХ: ${formatTime(timeLeft)}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    timerId = null;
                    isTimerRunning = false;
                    canUndo = false;
                    if (undoTimeoutId) {
                        clearTimeout(undoTimeoutId);
                        undoTimeoutId = null;
                    }
                    render();
                }
            }, 1000);
        }
        
        function undoAction() {
            if (!canUndo || isTimerRunning) return;
            
            const exIndex = lastAction === 'exercise' ? state.currentEx - 1 : state.currentEx;
            if (exIndex < 0) return;
            
            const ex = state.exercises[exIndex];
            
            if (lastAction === 'exercise') {
                // Rollback exercise completion
                state.currentEx--;
                ex.setsDone = 3;
            } else {
                // Rollback set
                ex.setsDone = Math.max(0, ex.setsDone - 1);
            }
            
            canUndo = false;
            if (undoTimeoutId) {
                clearTimeout(undoTimeoutId);
                undoTimeoutId = null;
            }
            
            // Stop timer if running
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                isTimerRunning = false;
                timeLeft = 0;
            }
            
            saveState();
            render();
        }
        
        // ===================== LEGENDARY =====================
        function showLegendary() {
            state.isFinished = true;
            state.lastWorkoutEnd = new Date().toISOString();
            state.dayNumber++;
            saveState();
            
            const legendary = document.getElementById('legendary');
            const nextDayText = document.getElementById('next-day-text');
            const unlock = getUnlockTime();
            
            if (unlock) {
                nextDayText.textContent = `Следующая тренировка доступна с ${unlock.toLocaleString('ru-RU', {day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'})}`;
            }
            
            legendary.classList.add('show');
            document.getElementById('stack').innerHTML = '';
        }
        
        // ===================== RESET (DEMO) =====================
        function resetApp() {
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        }
        
        // ===================== INIT =====================
        function init() {
            // Check lock
            if (isWorkoutLocked() && !state.isFinished) {
                const locked = document.getElementById('locked');
                const reason = document.getElementById('locked-reason');
                const unlock = getUnlockTime();
                reason.textContent = `Следующая тренировка доступна после 06:00 (${unlock.toLocaleString('ru-RU')})`;
                locked.classList.add('show');
                return;
            }
            
            // If was finished but unlocked now, reset for new day
            if (state.isFinished && !isWorkoutLocked()) {
                state.exercises.forEach(e => e.setsDone = 0);
                state.currentEx = 0;
                state.isFinished = false;
                saveState();
            }
            
            render();
        }
        
        init();
    </script>
</body>
</html>'''
