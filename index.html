'''<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PUSH DAY AMAN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            margin: 0;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background: #0a0a0f;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            opacity: 0.25;
            z-index: -1;
        }
        
        .header {
            width: 100%;
            padding: 20px 24px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        
        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        
        .day-dots {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #444;
            transition: all 0.3s;
        }
        
        .dot.active {
            background: #00ff88;
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
        }
        
        .dot.completed {
            background: #00ff88;
            border-color: #00ff88;
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
        }
        
        .stack-container {
            position: relative;
            width: 90%;
            max-width: 380px;
            height: 480px;
            margin-top: 10px;
        }
        
        .card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(20, 20, 30, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 20px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }
        
        .bookmark {
            position: absolute;
            top: 0;
            right: 20px;
            width: 28px;
            height: 36px;
            background: linear-gradient(180deg, #c9a84c, #a08030);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .card.active {
            z-index: 10;
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        
        .card.peek {
            z-index: 5;
            transform: translateY(52px) scale(0.97);
            opacity: 0.6;
            height: 420px;
            pointer-events: none;
        }
        
        .card.peek .card-content {
            opacity: 0;
        }
        
        .card.peek .peek-title {
            display: block;
            position: absolute;
            bottom: 16px;
            left: 20px;
            font-size: 0.95rem;
            opacity: 0.7;
            font-weight: 600;
        }
        
        .card.peek2 {
            z-index: 3;
            transform: translateY(104px) scale(0.94);
            opacity: 0.35;
            height: 420px;
            pointer-events: none;
        }
        
        .card.peek2 .card-content {
            opacity: 0;
        }
        
        .card.peek2 .peek-title {
            display: block;
            position: absolute;
            bottom: 16px;
            left: 20px;
            font-size: 0.9rem;
            opacity: 0.5;
            font-weight: 600;
        }
        
        .card.done {
            z-index: 1;
            transform: translateY(500px) scale(0.85);
            opacity: 0;
            pointer-events: none;
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }
        
        .exercise-icon {
            width: 56px;
            height: 56px;
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }
        
        .card-header h3 {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .peek-title { display: none; }
        
        .sets-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .set-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
        }
        
        .set-num {
            width: 24px;
            font-size: 0.9rem;
            opacity: 0.5;
            font-weight: 600;
        }
        
        .set-inputs {
            display: flex;
            gap: 8px;
            flex: 1;
            align-items: center;
        }
        
        .set-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: none;
            background: #00d4ff;
            color: #000;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        
        .set-btn:active {
            transform: scale(0.92);
        }
        
        .set-value {
            flex: 1;
            height: 44px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }
        
        .set-check {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        
        .set-check.empty {
            border: 2px solid rgba(255,255,255,0.15);
        }
        
        .set-check.done {
            background: #00ff88;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }
        
        .main-action {
            width: 100%;
            margin-top: 16px;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        
        .main-action:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.1));
        }
        
        .main-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .timer-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(15px);
            z-index: 500;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        
        .timer-overlay.show {
            display: flex;
        }
        
        .timer-ring {
            width: 220px;
            height: 220px;
            position: relative;
        }
        
        .timer-ring svg {
            transform: rotate(-90deg);
        }
        
        .timer-ring circle {
            fill: none;
            stroke-width: 8;
        }
        
        .timer-ring .bg {
            stroke: rgba(255,255,255,0.08);
        }
        
        .timer-ring .progress {
            stroke: #00d4ff;
            stroke-linecap: round;
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.5));
            transition: stroke-dashoffset 1s linear;
        }
        
        .timer-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .timer-text .time {
            font-size: 3.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }
        
        .timer-text .label {
            font-size: 0.9rem;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 4px;
        }
        
        .timer-legendary {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
        }
        
        .undo-timer-btn {
            margin-top: 70px;
            padding: 14px 40px;
            background: linear-gradient(135deg, #ff4757, #cc0000);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(255,71,87,0.3);
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .completed-section {
            width: 90%;
            max-width: 380px;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 40px;
        }
        
        .completed-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: rgba(0, 255, 136, 0.06);
            border: 1px solid rgba(0, 255, 136, 0.15);
            border-radius: 16px;
            animation: slideIn 0.4s ease;
            backdrop-filter: blur(10px);
        }
        
        .completed-row .name {
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0.9;
        }
        
        .completed-row .info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .completed-row .weight {
            font-size: 0.9rem;
            font-weight: 700;
            color: #00ff88;
        }
        
        .completed-row .check {
            width: 24px;
            height: 24px;
            background: #00ff88;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 0.8rem;
            font-weight: 800;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }
        
        #legendary {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.95);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease;
        }
        
        #legendary.show {
            display: flex;
        }
        
        .legendary-ring {
            width: 280px;
            height: 280px;
            position: relative;
        }
        
        .legendary-ring svg {
            animation: spin 20s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .legendary-ring .progress {
            stroke: #00d4ff;
            stroke-linecap: round;
            filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.6));
        }
        
        .legendary-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .legendary-text h1 {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulse 2s ease infinite;
        }
        
        .legendary-text .sec {
            font-size: 1rem;
            opacity: 0.5;
            letter-spacing: 4px;
            margin-top: 8px;
        }
        
        .legendary-stars {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            color: #ffd700;
            font-size: 1.2rem;
            animation: twinkle 2s ease infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .locked {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.95);
            z-index: 999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        
        .locked.show {
            display: flex;
        }
        
        .locked h2 {
            font-size: 1.8rem;
            margin-bottom: 16px;
        }
        
        .locked p {
            opacity: 0.5;
            font-size: 1rem;
            line-height: 1.6;
        }
        
        .locked .unlock-time {
            margin-top: 24px;
            padding: 16px 32px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #00d4ff;
        }
        
        .demo-reset {
            margin-top: 40px;
            padding: 14px 32px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="day-title">PUSH DAY</h1>
        <div class="day-dots" id="day-dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <div class="stack-container" id="stack"></div>
    
    <div class="completed-section" id="completed"></div>
    
    <div class="timer-overlay" id="timer-overlay">
        <div class="timer-ring">
            <svg width="220" height="220" viewBox="0 0 220 220">
                <circle class="bg" cx="110" cy="110" r="100"/>
                <circle class="progress" id="timer-circle" cx="110" cy="110" r="100" 
                    stroke-dasharray="628" stroke-dashoffset="0"/>
            </svg>
            <div class="timer-text">
                <div class="time" id="timer-display">60</div>
                <div class="label">SEC</div>
            </div>
            <div class="timer-legendary">LEGENDARY</div>
        </div>
        <button class="undo-timer-btn" id="undo-timer-btn" onclick="undoFromTimer()">ОТМЕНИТЬ ПОДХОД</button>
    </div>
    
    <div id="legendary">
        <div class="legendary-ring">
            <svg width="280" height="280" viewBox="0 0 280 280">
                <circle cx="140" cy="140" r="130" stroke="rgba(255,255,255,0.05)" stroke-width="6" fill="none"/>
                <circle class="progress" cx="140" cy="140" r="130" 
                    stroke-dasharray="816" stroke-dashoffset="200" stroke-width="6" fill="none"/>
            </svg>
            <div class="legendary-text">
                <h1>LEGENDARY</h1>
                <div class="sec">SEC</div>
            </div>
            <div class="legendary-stars">
                <span class="star" style="top:10%;left:20%;animation-delay:0s">✦</span>
                <span class="star" style="top:15%;right:15%;animation-delay:0.3s">✦</span>
                <span class="star" style="top:60%;left:10%;animation-delay:0.6s">✦</span>
                <span class="star" style="top:70%;right:20%;animation-delay:0.9s">✦</span>
                <span class="star" style="top:40%;left:5%;animation-delay:1.2s">✦</span>
            </div>
        </div>
        <p style="margin-top:40px;opacity:0.6;font-size:1.1rem;">Тренировка пройдена!</p>
        <p id="next-unlock-text" style="margin-top:12px;opacity:0.4;font-size:0.9rem;"></p>
        <button class="demo-reset" onclick="resetApp()">СБРОСИТЬ (ДЕМО)</button>
    </div>
    
    <div class="locked" id="locked">
        <h2>🔒 ТРЕНИРОВКА ЗАБЛОКИРОВАНА</h2>
        <p>Следующая тренировка будет доступна только после 06:00 утра следующего дня.</p>
        <div class="unlock-time" id="unlock-time"></div>
        <button class="demo-reset" onclick="resetApp()" style="margin-top:30px;">СБРОСИТЬ (ДЕМО)</button>
    </div>

    <script>
        // ===================== PROGRAM DATA =====================
        const PROGRAM = {
            days: [
                {
                    name: "PUSH DAY",
                    exercises: [
                        { name: "Жим штанги лежа", weight: 50 },
                        { name: "Жим гантелей сидя", weight: 20 },
                        { name: "Отжимания на брусьях", weight: 0 }
                    ]
                },
                {
                    name: "PULL DAY",
                    exercises: [
                        { name: "Подтягивания", weight: 0 },
                        { name: "Тяга штанги в наклоне", weight: 40 },
                        { name: "Сгибания рук со штангой стоя", weight: 25 }
                    ]
                },
                {
                    name: "LEGS DAY",
                    exercises: [
                        { name: "Приседания со штангой", weight: 60 },
                        { name: "Жим ногами", weight: 80 },
                        { name: "Подъем ног в висе", weight: 0 }
                    ]
                }
            ]
        };
        
        const STORAGE_KEY = 'pushDayAman_v5';
        
        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) return JSON.parse(saved);
            return {
                currentDay: 0,
                dayProgress: [false, false, false],
                exercises: JSON.parse(JSON.stringify(PROGRAM.days[0].exercises.map(e => ({...e, sets: [null, null, null, null]})))),
                currentEx: 0,
                lastWorkoutEnd: null,
                isFinished: false
            };
        }
        
        let state = loadState();
        
        let timerId = null;
        let timeLeft = 0;
        let totalTime = 0;
        let isTimerRunning = false;
        let canUndo = false;
        let lastAction = null;
        
        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }
        
        function isWorkoutLocked() {
            if (!state.lastWorkoutEnd) return false;
            const lastEnd = new Date(state.lastWorkoutEnd);
            const now = new Date();
            const nextDay6AM = new Date(lastEnd);
            nextDay6AM.setDate(nextDay6AM.getDate() + 1);
            nextDay6AM.setHours(6, 0, 0, 0);
            return now < nextDay6AM;
        }
        
        function getUnlockTime() {
            if (!state.lastWorkoutEnd) return null;
            const lastEnd = new Date(state.lastWorkoutEnd);
            const unlock = new Date(lastEnd);
            unlock.setDate(unlock.getDate() + 1);
            unlock.setHours(6, 0, 0, 0);
            return unlock;
        }
        
        function initDay() {
            const day = PROGRAM.days[state.currentDay];
            document.getElementById('day-title').textContent = day.name;
            
            if (!state.exercises || state.exercises.length !== day.exercises.length) {
                state.exercises = JSON.parse(JSON.stringify(day.exercises.map(e => ({...e, sets: [null, null, null, null]}))));
                state.currentEx = 0;
            }
        }
        
        // ===================== RENDER =====================
        function render() {
            initDay();
            
            const stack = document.getElementById('stack');
            const completed = document.getElementById('completed');
            const dots = document.getElementById('day-dots');
            
            // Dots: completed = green, current = active green, future = gray
            dots.innerHTML = state.dayProgress.map((done, i) => {
                let cls = 'dot';
                if (done) cls += ' completed';
                else if (i === state.currentDay) cls += ' active';
                return `<div class="${cls}"></div>`;
            }).join('');
            
            // Completed rows
            const doneExercises = state.exercises.filter((ex, i) => i < state.currentEx);
            completed.innerHTML = doneExercises.map(ex => `
                <div class="completed-row">
                    <span class="name">${ex.name}</span>
                    <div class="info">
                        <span class="weight">${ex.weight.toFixed(1)} кг</span>
                        <div class="check">✓</div>
                    </div>
                </div>
            `).join('');
            
            // Stack
            if (state.currentEx >= state.exercises.length) {
                finishDay();
                return;
            }
            
            let html = '';
            const totalEx = state.exercises.length;
            
            for (let i = 0; i < totalEx; i++) {
                const ex = state.exercises[i];
                const isDone = ex.sets.every(s => s !== null);
                const isCurrent = i === state.currentEx;
                const isFuture = i > state.currentEx;
                
                if (isDone) continue;
                
                let cardClass = '';
                let style = '';
                
                if (isCurrent) {
                    cardClass = 'active';
                    style = 'z-index: 10;';
                } else if (isFuture) {
                    const peekIndex = i - state.currentEx;
                    if (peekIndex === 1) {
                        cardClass = 'peek';
                        style = `z-index: ${8 - i};`;
                    } else {
                        cardClass = 'peek2';
                        style = `z-index: ${5 - i};`;
                    }
                }
                
                html += renderCard(ex, i, cardClass, style, isCurrent);
            }
            
            stack.innerHTML = html;
        }
        
        function renderCard(ex, index, cardClass, style, isCurrent) {
            if (!isCurrent) {
                return `
                    <div class="card ${cardClass}" style="${style}">
                        <div class="card-content">
                            <div class="card-header">
                                <div class="exercise-icon">💪</div>
                                <h3>${ex.name}</h3>
                            </div>
                        </div>
                        <div class="peek-title">${ex.name}</div>
                    </div>
                `;
            }
            
            const setsHtml = ex.sets.map((s, i) => {
                const isDone = s !== null;
                const showControls = !isDone && i === ex.sets.filter(x => x !== null).length;
                const rowNum = i + 1;
                
                if (isDone) {
                    return `
                        <div class="set-row">
                            <span class="set-num">${rowNum}</span>
                            <div class="set-inputs">
                                <div class="set-value">${ex.weight.toFixed(1)} кг</div>
                            </div>
                            <div class="set-check done">✓</div>
                        </div>
                    `;
                } else if (showControls) {
                    return `
                        <div class="set-row">
                            <span class="set-num">${rowNum}</span>
                            <div class="set-inputs">
                                <button class="set-btn" onclick="changeW(-2.5)">-</button>
                                <div class="set-value">${ex.weight.toFixed(1)} кг</div>
                                <button class="set-btn" onclick="changeW(2.5)">+</button>
                            </div>
                            <div class="set-check empty"></div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="set-row">
                            <span class="set-num">${rowNum}</span>
                            <div class="set-inputs">
                                <div class="set-value" style="opacity:0.3">—</div>
                            </div>
                            <div class="set-check empty"></div>
                        </div>
                    `;
                }
            }).join('');
            
            const allDone = ex.sets.every(s => s !== null);
            const btnText = allDone ? 'ЗАВЕРШИТЬ УПРАЖНЕНИЕ' : 'ЗАВЕРШИТЬ ПОДХОД';
            
            return `
                <div class="card ${cardClass}" style="${style}">
                    <div class="bookmark"></div>
                    <div class="card-content">
                        <div class="card-header">
                            <div class="exercise-icon">💪</div>
                            <h3>${ex.name}</h3>
                        </div>
                        <div class="sets-list">
                            ${setsHtml}
                        </div>
                        <button class="main-action" id="main-btn" onclick="completeSet()">
                            ${btnText}
                        </button>
                    </div>
                    <div class="peek-title">${ex.name}</div>
                </div>
            `;
        }
        
        // ===================== ACTIONS =====================
        function changeW(delta) {
            const ex = state.exercises[state.currentEx];
            ex.weight = Math.max(0, ex.weight + delta);
            saveState();
            render();
        }
        
        function completeSet() {
            const ex = state.exercises[state.currentEx];
            const setIndex = ex.sets.findIndex(s => s === null);
            if (setIndex === -1) return;
            
            ex.sets[setIndex] = ex.weight;
            lastAction = { exIndex: state.currentEx, setIndex };
            canUndo = true;
            
            const isLastSet = ex.sets.every(s => s !== null);
            const duration = isLastSet ? 180 : 60;
            
            saveState();
            startTimer(duration);
        }
        
        function startTimer(duration) {
            isTimerRunning = true;
            timeLeft = duration;
            totalTime = duration;
            
            const overlay = document.getElementById('timer-overlay');
            const display = document.getElementById('timer-display');
            const circle = document.getElementById('timer-circle');
            const undoBtn = document.getElementById('undo-timer-btn');
            
            overlay.classList.add('show');
            undoBtn.style.display = 'block';
            
            const circumference = 2 * Math.PI * 100;
            circle.style.strokeDasharray = circumference;
            
            display.textContent = duration;
            
            timerId = setInterval(() => {
                timeLeft--;
                display.textContent = timeLeft;
                
                const offset = circumference - (timeLeft / totalTime) * circumference;
                circle.style.strokeDashoffset = offset;
                
                if (totalTime - timeLeft >= 5) {
                    undoBtn.style.display = 'none';
                    canUndo = false;
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    timerId = null;
                    isTimerRunning = false;
                    canUndo = false;
                    overlay.classList.remove('show');
                    
                    const ex = state.exercises[state.currentEx];
                    if (ex.sets.every(s => s !== null)) {
                        state.currentEx++;
                        saveState();
                    }
                    
                    render();
                }
            }, 1000);
        }
        
        function undoFromTimer() {
            if (!canUndo || !lastAction) return;
            
            clearInterval(timerId);
            timerId = null;
            isTimerRunning = false;
            canUndo = false;
            
            const ex = state.exercises[lastAction.exIndex];
            ex.sets[lastAction.setIndex] = null;
            
            document.getElementById('timer-overlay').classList.remove('show');
            saveState();
            render();
        }
        
        // ===================== DAY COMPLETION =====================
        function finishDay() {
            state.dayProgress[state.currentDay] = true;
            state.lastWorkoutEnd = new Date().toISOString();
            
            if (state.dayProgress.every(d => d)) {
                showLegendary();
                return;
            }
            
            state.currentDay++;
            const nextDay = PROGRAM.days[state.currentDay];
            state.exercises = JSON.parse(JSON.stringify(nextDay.exercises.map(e => ({...e, sets: [null, null, null, null]}))));
            state.currentEx = 0;
            saveState();
            
            render();
        }
        
        // ===================== LEGENDARY =====================
        function showLegendary() {
            state.isFinished = true;
            state.lastWorkoutEnd = new Date().toISOString();
            saveState();
            
            const legendary = document.getElementById('legendary');
            const nextText = document.getElementById('next-unlock-text');
            const unlock = getUnlockTime();
            
            if (unlock) {
                nextText.textContent = `Новый цикл доступен с ${unlock.toLocaleString('ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'})}`;
            }
            
            legendary.classList.add('show');
        }
        
        // ===================== RESET =====================
        function resetApp() {
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        }
        
        // ===================== INIT =====================
        function init() {
            if (isWorkoutLocked() && !state.isFinished) {
                const locked = document.getElementById('locked');
                const timeEl = document.getElementById('unlock-time');
                const unlock = getUnlockTime();
                timeEl.textContent = unlock.toLocaleString('ru-RU');
                locked.classList.add('show');
                return;
            }
            
            if (state.isFinished && !isWorkoutLocked()) {
                state.dayProgress = [false, false, false];
                state.currentDay = 0;
                state.exercises = JSON.parse(JSON.stringify(PROGRAM.days[0].exercises.map(e => ({...e, sets: [null, null, null, null]}))));
                state.currentEx = 0;
                state.isFinished = false;
                saveState();
            }
            
            render();
        }
        
        init();
    </script>
</body>
