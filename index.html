<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legendary Fitness</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #00d4ff; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; padding: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; }
        .controls { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 10px 0; }
        button { background: var(--accent); border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-finish { background: #ffcc00; color: #000; width: 100%; margin-top: 10px; }
        #global-timer { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222; padding: 15px; border-radius: 50px; border: 2px solid var(--accent); display: none; }
    </style>
</head>
<body>
    <h1>PUSH DAY</h1>
    <div id="exercise-list"></div>
    <div id="global-timer">Таймер: <span id="time-left">00:00</span></div>

    <script>
        const exercises = ["Жим штанги лежа", "Жим гантелей сидя", "Отжимания на брусьях"];
        const container = document.getElementById('exercise-list');

        function startTimer(seconds) {
            let display = document.getElementById('global-timer');
            let timeText = document.getElementById('time-left');
            display.style.display = 'block';
            let timer = seconds;
            
            let interval = setInterval(() => {
                let m = Math.floor(timer / 60);
                let s = timer % 60;
                timeText.innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if (--timer < 0) { clearInterval(interval); display.style.display = 'none'; }
            }, 1000);
        }

        exercises.forEach((ex, idx) => {
            let div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <h3>${ex}</h3>
                <div class="controls">
                    <button onclick="changeWeight(${idx}, -2.5)">-2.5</button>
                    <span id="weight-${idx}">50</span> кг
                    <button onclick="changeWeight(${idx}, 2.5)">+2.5</button>
                </div>
                ${[1,2,3,4].map(s => `
                    <div style="display:flex; justify-content:space-between; padding:5px 0;">
                        <span>Подход ${s}</span>
                        <input type="checkbox" onchange="if(this.checked) startTimer(60)">
                    </div>
                `).join('')}
                <button class="btn-finish" onclick="startTimer(180)">ЗАВЕРШИТЬ УПРАЖНЕНИЕ (3 мин)</button>
            `;
            container.appendChild(div);
        });

        function changeWeight(idx, val) {
            let el = document.getElementById(`weight-${idx}`);
            el.innerText = Math.max(0, parseFloat(el.innerText) + val);
        }
    </script>
</body>
</html>
