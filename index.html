<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legendary Fitness</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #00d4ff; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; padding: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .set-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #333; }
        button { background: var(--accent); border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 5px; }
        .check { width: 30px; height: 30px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>PUSH DAY</h1>
    <div id="exercise-list"></div>

    <script>
        const exercises = ["Жим штанги лежа", "Жим гантелей сидя", "Отжимания на брусьях"];
        const container = document.getElementById('exercise-list');

        exercises.forEach((ex, idx) => {
            let div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <h3>${ex}</h3>
                <p>4 подхода по 10-12 раз</p>
                <div id="sets-${idx}">
                    ${[1,2,3,4].map(s => `
                        <div class="set-row">
                            <span>Подход ${s}</span>
                            <input type="checkbox" class="check">
                        </div>
                    `).join('')}
                </div>
            `;
            container.appendChild(div);
        });
    </script>
</body>
</html>
