<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legendary Fitness</title>
    <style>
        :root { --bg: #121212; --accent: #00d4ff; --gold: #ffd700; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; padding: 20px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        .hidden { display: none; }
        button { background: var(--accent); border: none; padding: 10px; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 5px; }
        .set-btn { background: #333; margin: 5px 0; }
        .active-set { background: var(--gold); color: #000; }
        .timer-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--accent); color: #000; text-align: center; padding: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>PUSH DAY</h1>
    <div id="exercise-list"></div>
    <div id="timer-bar" class="timer-bar hidden">Отдых: <span id="time-left">00:00</span></div>

    <script>
        const exercises = ["Жим штанги лежа", "Жим гантелей сидя", "Отжимания на брусьях"];
        const container = document.getElementById('exercise-list');

        exercises.forEach((ex, exIdx) => {
            let div = document.createElement('div');
            div.className = 'card';
            div.id = `ex-${exIdx}`;
            div.innerHTML = `
                <h3 id="title-${exIdx}">${ex}</h3>
                <div id="content-${exIdx}">
                    <div style="margin: 10px 0;">Вес: <span id="w-${exIdx}">50</span> кг</div>
                    ${[1,2,3,4].map(s => `<button class="set-btn" id="s-${exIdx}-${s}" onclick="finishSet(${exIdx}, ${s})">Подход ${s}</button>`).join('')}
                </div>
            `;
            container.appendChild(div);
        });

        function finishSet(exIdx, s) {
            document.getElementById(`s-${exIdx}-${s}`).classList.add('hidden');
            if (s < 4) {
                startTimer(60, () => document.getElementById(`s-${exIdx}-${s+1}`).classList.add('active-set'));
            } else {
                finishExercise(exIdx);
            }
        }

        function finishExercise(exIdx) {
            const weight = document.getElementById(`w-${exIdx}`).innerText;
            const title = document.getElementById(`title-${exIdx}`).innerText;
            document.getElementById(`ex-${exIdx}`).innerHTML = `<h3>${title} | ${weight} кг | ✅</h3>`;
            startTimer(180);
        }

        function startTimer(seconds, callback) {
            const bar = document.getElementById('timer-bar');
            bar.classList.remove('hidden');
            let t = seconds;
            let i = setInterval(() => {
                document.getElementById('time-left').innerText = t--;
                if (t < 0) { 
                    clearInterval(i); 
                    bar.classList.add('hidden'); 
                    if (callback) callback();
                }
            }, 1000);
        }
    </script>
</body>
</html>
