<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legendary Fitness</title>
    <style>
        :root { --bg: #121212; --accent: #00d4ff; --gold: #ffd700; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; padding: 20px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        .controls { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
        input[type="number"] { width: 60px; background: #333; color: #fff; border: none; padding: 5px; text-align: center; }
        button { background: var(--accent); border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .set-btn { background: #333; margin: 5px 0; display: block; width: 100%; text-align: center; }
        .hidden { display: none; }
        .timer-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--accent); color: #000; text-align: center; padding: 15px; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>
    <h1>PUSH DAY AMAN</h1>
    <div id="exercise-list"></div>
    <div id="timer-bar" class="timer-bar hidden">Отдых: <span id="time-left">00</span></div>

    <script>
        const exercises = ["Жим штанги лежа", "Жим гантелей сидя", "Отжимания на брусьях"];
        const container = document.getElementById('exercise-list');

        exercises.forEach((ex, i) => {
            let div = document.createElement('div');
            div.className = 'card';
            div.id = `ex-${i}`;
            div.innerHTML = `
                <h3 id="title-${i}">${ex}</h3>
                <div class="controls">
                    <button onclick="adjW(${i}, -2.5)">-</button>
                    <input type="number" id="w-${i}" value="50"> кг
                    <button onclick="adjW(${i}, 2.5)">+</button>
                </div>
                <p>Повторы: 10-12</p>
                <div id="content-${i}">
                    ${[1,2,3,4].map(s => `<button class="set-btn" id="s-${i}-${s}" onclick="finishSet(${i}, ${s})">Завершить ${s}-й подход</button>`).join('')}
                </div>
            `;
            container.appendChild(div);
        });

        function adjW(i, val) {
            let input = document.getElementById(`w-${i}`);
            input.value = Math.max(0, parseFloat(input.value) + val);
        }

        function finishSet(i, s) {
            document.getElementById(`s-${i}-${s}`).classList.add('hidden');
            if (s < 4) {
                runPrecisionTimer(60);
            } else {
                let w = document.getElementById(`w-${i}`).value;
                document.getElementById(`ex-${i}`).innerHTML = `<h3>${document.getElementById(`title-${i}`).innerText} | ${w} кг | ✅</h3>`;
                runPrecisionTimer(180);
            }
        }

        function runPrecisionTimer(sec) {
            const bar = document.getElementById('timer-bar');
            const disp = document.getElementById('time-left');
            bar.classList.remove('hidden');
            
            const end = Date.now() + sec * 1000;
            const int = setInterval(() => {
                const rem = Math.round((end - Date.now()) / 1000);
                if (rem < 0) {
                    clearInterval(int);
                    bar.classList.add('hidden');
                } else {
                    disp.innerText = rem;
                }
            }, 100);
        }
    </script>
</body>
</html>
